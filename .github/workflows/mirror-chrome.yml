name: Mirror Chrome for Testing

on:
  workflow_dispatch:
    inputs:
      versions_count:
        description: "Newest versions to mirror/retain"
        required: true
        default: "5"
        type: choice
        options: ["1", "3", "5", "10"]
      platforms:
        description: "Comma-separated CfT platforms"
        required: true
        default: "linux64,linux-arm64"
        type: string

permissions:
  contents: write

concurrency:
  group: chrome-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq curl unzip

      - name: Mirror Chrome
        env:
          VERSIONS_COUNT: ${{ inputs.versions_count }}
          KEEP_VERSIONS: ${{ inputs.versions_count }}
          PLATFORMS: ${{ inputs.platforms }}
        run: bash scripts/mirror-chrome.sh

      - name: Validate generated mirror
        run: |
          jq -e '.latest_stable and (.builds | length > 0)' manifest.json >/dev/null
          test -s chrome/LATEST_STABLE
          bash -n scripts/mirror-chrome.sh
          bash -n scripts/install-chrome.sh

      - name: Commit mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chrome manifest.json
          if git diff --cached --quiet; then
            echo "Mirror already current."
            exit 0
          fi
          git commit -m "chore(chrome): mirror latest Chrome for Testing"
          git push
